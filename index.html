
<!DOCTYPE html>
<html>
<head>
  <title>GLITCH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #000; color: white; font-family: Arial; text-align: center; padding-top: 100px; }
    h1 { color: #00BFFF; font-size: 60px; letter-spacing: 5px; }
    p { color: #888; }
    input, button { padding: 12px; margin: 10px; width: 250px; border: none; border-radius: 8px; }
    button { background: #00BFFF; color: black; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: white; }
  </style>
</head>
<body>
  
<h2 id="welcome" style="color:#00ffcc; text-align:center;"></h2>

<div id="auth-box">
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">
  <button onclick="signup()">SIGN UP</button>
  <button onclick="login()">LOGIN</button>
</div>

<button id="logout-btn" onclick="logout()" style="display:none;">LOGOUT</button>


<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  const firebaseConfig = {
    apiKey: "AIzaSyASgX3V17xe3Yras_M-tBfEUt2Uao7Cjmc",
    authDomain: "glitch-36bba.firebaseapp.com",
    projectId: "glitch-36bba",
    storageBucket: "glitch-36bba.firebasestorage.app",
    messagingSenderId: "939903826476",
    appId: "1:939903826476:web:c6adc1e7ba75776e022f89",
    measurementId: "G-VGPFY77287"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  // Make functions work with the buttons
  window.signup = () => {
    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;
    createUserWithEmailAndPassword(auth, email, password)
      .then(() => alert("Account created!"))
      .catch(e => alert(e.message));
  }

  window.login = () => {
    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;
    signInWithEmailAndPassword(auth, email, password)
      .then(() => alert("Logged in!"))
      .catch(e => alert(e.message));
  }

   window.logout = () => {
  signOut(auth).then(() => alert("Logged out!"));
}; // <-- ADD THIS } AND ;
  onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("auth-box").style.display = "none";
    document.getElementById("logout-btn").style.display = "block";
    document.getElementById("welcome").innerText = `Welcome ${user.email}`;
  } else {
    document.getElementById("auth-box").style.display = "block";
    document.getElementById("logout-btn").style.display = "none";
    document.getElementById("welcome").innerText = "";
  }
});
</script>
</html>
